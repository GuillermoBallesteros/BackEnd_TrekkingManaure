services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Bogota
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      HEALTH_ENCRYPTION_KEY: ${HEALTH_ENCRYPTION_KEY}
      HEALTH_ENCRYPTION_KEY_ANTERIORES: ${HEALTH_ENCRYPTION_KEY_ANTERIORES:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BREVO_ACTIVO: ${BREVO_ACTIVO:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_REMITENTE_CORREO: ${BREVO_REMITENTE_CORREO:-manaureecoturisticointernacional@manaurevive.com}
      BREVO_REMITENTE_NOMBRE: ${BREVO_REMITENTE_NOMBRE:-ManaureVive}
      BREVO_PLANTILLA_PAGO_3_DIAS: ${BREVO_PLANTILLA_PAGO_3_DIAS:-0}
      BREVO_PLANTILLA_PAGO_1_DIA: ${BREVO_PLANTILLA_PAGO_1_DIA:-0}
      BREVO_PLANTILLA_PAGO_HOY: ${BREVO_PLANTILLA_PAGO_HOY:-0}
      BREVO_PLANTILLA_PAGO_VENCIDO: ${BREVO_PLANTILLA_PAGO_VENCIDO:-0}
      BREVO_PLANTILLA_PAGO_APROBADO: ${BREVO_PLANTILLA_PAGO_APROBADO:-0}
      BREVO_PLANTILLA_PAGO_RECHAZADO: ${BREVO_PLANTILLA_PAGO_RECHAZADO:-0}
      BREVO_PLANTILLA_EVENTO_MANANA: ${BREVO_PLANTILLA_EVENTO_MANANA:-0}
    ports:
      - "8080:8080"

volumes:
  db_data:
