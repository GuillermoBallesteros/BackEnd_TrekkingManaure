# Producción. Uso (SIN docker-compose.override.yml):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Solo Caddy publica puertos (80 y 443); web, api y db quedan en la red interna.
# El sitio se construye desde el repositorio del front, clonado al lado de este (FRONT_DIR).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging: *logging

  api:
    restart: unless-stopped
    # Vacía la lista de puertos del compose base (8080 no se publica).
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
    # La JVM usa el 75 % de este límite (MaxRAMPercentage del Dockerfile).
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    logging: *logging

  web:
    build:
      context: ${FRONT_DIR:-../../TrekkingManaure}
      target: production
      args:
        # Un solo origen: el navegador llama a la API en el mismo dominio (Caddy enruta /api).
        VITE_API_URL: https://${DOMAIN:?DOMAIN es obligatorio en producción}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-meoo7p5s}
    image: trekking-manaure/web:latest
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN es obligatorio en producción}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
