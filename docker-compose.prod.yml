# Producción. Uso (SIN docker-compose.override.yml):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Solo Caddy publica puertos (80 y 443); api y db quedan en la red interna.
services:
  db:
    restart: unless-stopped

  api:
    restart: unless-stopped
    # Vacía la lista de puertos del compose base (8080 no se publica).
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN es obligatorio en producción}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
